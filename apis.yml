aid: findable
name: Findable
description: >-
  Findable is an AI-powered building intelligence platform (findable.ai, formerly
  findable.no) that makes construction and property documentation searchable,
  structured, and audit-ready. It uses AI to classify building documents against
  standards such as BS 9991 and NS 3451, detect missing or expiring documents,
  support Golden Thread / Building Safety Act compliance, and answer natural-language
  questions across a building's documentation. Findable exposes a Partner API
  (api.findable.ai) for document search and AI Q&A, a hosted MCP server
  (mcp.findable.ai) with ~28 tools, and official TypeScript SDK and React component
  libraries. Used by 150+ property organizations across Norway and the UK.
